apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
  namespace: ml-training
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml
          volumeMounts:
            - name: config-vol
              mountPath: /app/configs
            - name: storage-vol
              mountPath: /app/data
              subPath: data
            - name: storage-vol
              mountPath: /app/checkpoints
              subPath: checkpoints
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config-vol
          configMap:
            name: training-config
        - name: storage-vol
          persistentVolumeClaim:
            claimName: ml-storage
