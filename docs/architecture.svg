<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="28" font-size="14" font-weight="bold" fill="#2C2C2A">Build</text>
  <rect x="40" y="40" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="115" y="66" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Docker images</text>
  <text x="115" y="84" font-size="12" fill="#5F5E5A" text-anchor="middle">train + serve</text>

  <text x="40" y="132" font-size="14" font-weight="bold" fill="#0C447C">Kubernetes cluster (kind, namespace: ml-training)</text>
  <rect x="40" y="144" width="600" height="300" rx="20" fill="#E6F1FB" fill-opacity="0.4" stroke="#185FA5" stroke-width="0.5"/>

  <rect x="70" y="182" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="160" y="205" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">Training Job</text>
  <text x="160" y="224" font-size="12" fill="#534AB7" text-anchor="middle">ResNet-18, CIFAR-10</text>
  <text x="160" y="240" font-size="12" fill="#534AB7" text-anchor="middle">writes checkpoint</text>

  <rect x="270" y="182" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="205" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">PVC storage</text>
  <text x="345" y="224" font-size="12" fill="#0F6E56" text-anchor="middle">data + checkpoint</text>
  <text x="345" y="240" font-size="12" fill="#0F6E56" text-anchor="middle">persists</text>

  <rect x="440" y="182" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="205" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">Serving Deployment</text>
  <text x="530" y="224" font-size="12" fill="#534AB7" text-anchor="middle">2 replicas, probes</text>
  <text x="530" y="240" font-size="12" fill="#534AB7" text-anchor="middle">reads checkpoint</text>

  <rect x="70" y="300" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="160" y="326" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">ConfigMap</text>
  <text x="160" y="344" font-size="12" fill="#5F5E5A" text-anchor="middle">hyperparameters</text>

  <rect x="440" y="300" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="530" y="326" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Service</text>
  <text x="530" y="344" font-size="12" fill="#0F6E56" text-anchor="middle">ClusterIP 80 to 8080</text>

  <line x1="115" y1="96" x2="140" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M190 68 L530 68 L530 180" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="62" font-size="12" fill="#5F5E5A" text-anchor="middle">serve image</text>

  <line x1="250" y1="217" x2="266" y2="217" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="217" x2="424" y2="217" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="160" y1="300" x2="160" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="300" x2="530" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="418" font-size="14" font-weight="bold" fill="#2C2C2A">Client</text>
  <rect x="440" y="392" width="180" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="530" y="416" font-size="12" fill="#993C1D" text-anchor="middle">curl POST /predict</text>
  <line x1="530" y1="392" x2="530" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
